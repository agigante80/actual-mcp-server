# #600 negative fixture: the token is required at interpolation, which breaks --profile dev.
services:
  mcp-server-prod:
    image: ghcr.io/agigante80/actual-mcp-server:latest
    env_file:
      - path: .env
        required: false
    environment:
      - MCP_SSE_AUTHORIZATION=${MCP_SSE_AUTHORIZATION:?MCP_SSE_AUTHORIZATION is required}
