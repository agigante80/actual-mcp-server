# yaml-language-server: $schema=https://www.coderabbit.ai/integrations/schema.v2.json
#
# CodeRabbit is an ADVISORY first-pass reviewer for pull requests against develop:
# those from outside contributors (#693) and, during the #715 trial, the maintainer's
# own (the maintainer must stay out of ignore_usernames). It never gates a merge: no commit status fails on it and it
# is in no branch protection. tests/unit/coderabbit_config.test.js pins the keys
# below that keep it scoped and quiet; change both together.
language: en-US
tone_instructions: >-
  Be brief and plain. Report concrete defects with the failing input or state.
  Skip praise and style taste. Never use an em dash or an en dash: use a colon,
  a comma or two sentences.
early_access: false

reviews:
  profile: chill
  # Advisory only: a finding never fails a commit status.
  commit_status: true
  fail_commit_status: false
  high_level_summary: false
  review_status: false
  poem: false
  in_progress_fortune: false
  sequence_diagrams: false
  suggested_reviewers: false
  auto_assign_reviewers: false
  suggested_labels: false
  auto_apply_labels: false
  auto_review:
    enabled: true
    drafts: false
    # Outside pull requests target develop. The default branch (main) only moves in
    # a release and is always in scope for the app; nothing is opened against it.
    base_branches:
      - '^develop$'
    # Dependency pull requests go through the dependency pipeline, not this reviewer.
    ignore_usernames:
      - 'dependabot[bot]'
      - 'actual-mcp-dependency-updater[bot]'
  path_filters:
    - '!package-lock.json'
    - '!generated/**'
    - '!dist/**'
  # No path_instructions on purpose: the app reads AGENTS.md and
  # .github/instructions/*.instructions.md as guidelines by default
  # (knowledge_base.code_guidelines), and tests/unit/contributor_docs.test.js keeps
  # those true. A copy of the rules here would be a second source nothing checks.
  # Nothing here may push a commit or a branch into the repository: a pushed branch
  # runs workflows from that branch. All five are ON by schema default.
  finishing_touches:
    unit_tests:
      enabled: false
    autofix:
      enabled: false
    fix_ci:
      enabled: false
    resolve_merge_conflict:
      enabled: false
    simplify:
      enabled: false
  # The app never approves a pull request, and no author can ask it to.
  auto_approvals:
    enabled: false
    allow_author_approval: false
  tools:
    # The repository uses neither linter; their defaults would be noise.
    eslint:
      enabled: false
    biome:
      enabled: false
    actionlint:
      enabled: true
    shellcheck:
      enabled: true
    gitleaks:
      enabled: true

chat:
  art: false
  # It answers only when mentioned.
  auto_reply: false

knowledge_base:
  code_guidelines:
    enabled: true
  # Anyone commenting can teach the bot: a learning waits for the maintainer.
  learnings:
    scope: local
    approval_delay: 30

# Issue comments in this repository are messages between people only.
issue_enrichment:
  auto_enrich:
    enabled: false
  planning:
    enabled: false
    auto_planning:
      enabled: false
