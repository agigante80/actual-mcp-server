name: Dependency Update & Auto-Release

# -----------------------------------------------------------------------------
# Single self-contained workflow that handles the full dependency update cycle:
#
#   1. Check whether @actual-app/api has a new version
#   2. Create a working branch and install the new version
#   3. TypeScript build  (lint)
#   4. Unit tests
#   5. Docker E2E tests   (full suite)
#   6.  ↳ only if ALL above are green:
#          - bump patch version & update docs
#          - merge the working branch to main (fast-forward, tags included)
#          - delete the temporary branch
#          - create a GitHub Release
#
# Because this is a single sequential job, GitHub automatically stops at the
# first failing step: no version bump, no merge, no release if CI is red.
# No PR or auto-merge machinery is needed.
# -----------------------------------------------------------------------------

on:
  schedule:
    # Run daily at 1:00 AM UTC
    - cron: '0 1 * * *'
  workflow_dispatch: # Allow manual triggering

permissions:
  contents: write
  pull-requests: write
  actions: read      # the publish guard reads ci-cd run status via gh (#261 fix 5)

jobs:
  update-test-release:
    name: Update • Lint • Test • Release
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # #325: consumed by the report-train-failure job. `train_outcome` is a CLOSED
    # enum; the reporter treats unset or unrecognised as a failure, so a job that
    # dies before the recording step still gets reported.
    outputs:
      train_outcome: ${{ steps.outcome.outputs.value }}
      latest_version: ${{ steps.versions.outputs.latest }}
    
    steps:
      # -----------------------------------------------------------------------
      # 1. Setup
      # -----------------------------------------------------------------------
      - name: Generate GitHub App token
        id: token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      # The App token (not GITHUB_TOKEN) authenticates the checkout, so every
      # later push is made by the App bot and triggers downstream workflows.
      # GITHUB_TOKEN pushes never fire ci-cd.yml, which is how v0.7.12 shipped
      # with no Docker image (#261 fix 2).
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0          # full history needed for merge + tagging
          token: ${{ steps.token.outputs.token }}
          # Explicit, not default-reliant (#262): the persisted App credential is
          # what authenticates the pushes to main and the tag; an upstream major
          # flipping the default would otherwise break the release lane silently.
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      # -----------------------------------------------------------------------
      # 2. Version check: bail out early if already up to date
      # -----------------------------------------------------------------------
      - name: Check for new @actual-app/api version
        id: versions
        run: |
          CURRENT=$(node -p "require('./package.json').dependencies['@actual-app/api']" | sed 's/[\^~]//g')
          # #300: `npm show <pkg> version` resolves the `latest` DIST-TAG, NOT the
          # highest published version. This is precisely what keeps prerelease and
          # nightly builds (for example 26.8.0-nightly.*) out of the automated
          # release train: they are published, but not on the `latest` dist-tag.
          # Do NOT switch this to a highest-published-version lookup (for example
          # `npm show @actual-app/api versions`, the plural list form), or the
          # train would auto-ship nightlies. Pinned by
          # tests/unit/workflow_release_guards.test.js invariant (l).
          LATEST=$(npm show @actual-app/api version)
          echo "current=$CURRENT" >> $GITHUB_OUTPUT
          echo "latest=$LATEST"   >> $GITHUB_OUTPUT
          if [ "$CURRENT" = "$LATEST" ]; then
            echo "update_needed=false" >> $GITHUB_OUTPUT
            echo "✅ Already on latest: $CURRENT: nothing to do"
          else
            echo "update_needed=true" >> $GITHUB_OUTPUT
            echo "🔔 Update available: $CURRENT → $LATEST"
          fi

      # -----------------------------------------------------------------------
      # 3. Create working branch, install new version, commit
      # -----------------------------------------------------------------------
      - name: Create branch and update dependency
        if: steps.versions.outputs.update_needed == 'true'
        env:
          LATEST: ${{ steps.versions.outputs.latest }}
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          BRANCH="deps/actual-api-${LATEST}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          echo "BRANCH=$BRANCH" >> $GITHUB_ENV

          # Install new version (updates package.json + package-lock.json + node_modules)
          npm install @actual-app/api@^${LATEST}

          # Update API version string in docs (best-effort, || true avoids failure
          # if a pattern has already been updated or doesn't exist)
          sed -i "s/@actual-app\/api \^[0-9.]*/@actual-app\/api ^${LATEST}/" README.md || true

          git add -A
          git commit -m "chore(deps): upgrade @actual-app/api to ${LATEST}"
          echo "✅ Working branch '$BRANCH' created and committed"

      # -----------------------------------------------------------------------
      # NOTE (#298, reverted by maintainer decision 2026-07-25): this lane does
      # NOT gate the @actual-app/api upgrade on `npm audit`. Updating the API is
      # deliberately INDEPENDENT of the rest of the dependency tree: a pre-existing
      # or unrelated CVE elsewhere must never hold back an API update. Dependency
      # security is handled separately (Dependabot / /dep-auditor), out of band
      # from this release train. See closed issue #298.
      # -----------------------------------------------------------------------

      # -----------------------------------------------------------------------
      # 4. Lint: TypeScript compilation
      # -----------------------------------------------------------------------
      - name: 🔍 TypeScript build
        if: steps.versions.outputs.update_needed == 'true'
        run: npm run build

      # -----------------------------------------------------------------------
      # 5. Lint: Tool coverage check
      # -----------------------------------------------------------------------
      - name: 🔍 Check tool coverage
        if: steps.versions.outputs.update_needed == 'true'
        run: npm run check:coverage

      # -----------------------------------------------------------------------
      # 6. Unit tests
      # -----------------------------------------------------------------------
      - name: 🧪 Run unit tests
        if: steps.versions.outputs.update_needed == 'true'
        env:
          ACTUAL_SERVER_URL: http://localhost:5006
          ACTUAL_PASSWORD: dummy-password-for-tests
          ACTUAL_BUDGET_SYNC_ID: 00000000-0000-0000-0000-000000000000
        run: npm run test:unit-js

      # -----------------------------------------------------------------------
      # 7. Docker E2E tests (full suite)
      # -----------------------------------------------------------------------
      - name: 🎭 Install Playwright browsers
        if: steps.versions.outputs.update_needed == 'true'
        timeout-minutes: 15   # #325: a step timeout is a step FAILURE; the job-level cap is a CANCEL the jobs API cannot attribute
        run: npx playwright install --with-deps

      - name: 🐳 Docker E2E tests (full suite)
        if: steps.versions.outputs.update_needed == 'true'
        timeout-minutes: 25   # #325: see above; keeps a hung E2E suite reportable
        run: npm run test:e2e:docker:full

      - name: 🧹 Cleanup Docker containers
        if: steps.versions.outputs.update_needed == 'true' && always()
        run: docker compose -f docker-compose.test.yaml down -v --remove-orphans

      # -----------------------------------------------------------------------
      # 8. All green: bump version and commit
      # -----------------------------------------------------------------------
      - name: 🔢 Bump patch version
        if: steps.versions.outputs.update_needed == 'true'
        id: bump
        run: |
          OLD=$(node -p "require('./package.json').version")
          npm run version:bump -- patch
          # Resync the lockfile: version-bump.js does not touch package-lock.json,
          # and a stale lock makes npm ci fail at the release commit (#261 fix 1).
          npm install --package-lock-only
          NEW=$(node -p "require('./package.json').version")
          # Canonical tool count via scripts/tool-count.mjs (#193): never re-derive
          # it with a private grep that can drift from IMPLEMENTED_TOOLS.
          TOOL_COUNT=$(node -e "import('./scripts/tool-count.mjs').then(m => console.log(m.getCanonicalCount()))")
          echo "old_version=$OLD" >> $GITHUB_OUTPUT
          echo "new_version=$NEW" >> $GITHUB_OUTPUT
          # No tool_count output since #301: this lane no longer writes a Release
          # body. ci-cd.yml derives the count itself. The value is still logged
          # below because it is a useful signal in this job's log.
          git add -A
          git commit -m "chore(release): bump version to ${NEW}"
          echo "✅ Version bumped to ${NEW} (lockfile resynced; ${TOOL_COUNT} tools)"

      # -----------------------------------------------------------------------
      # 8b. Re-verify the BUMPED tree (#297). Every check above ran on the
      #     pre-bump commit. version-bump.js then rewrote the doc markers and the
      #     lockfile was resynced, so the commit that actually reaches main and
      #     gets the immutable tag is the one commit CI never saw. Re-run the fast
      #     checks (build, tool-count drift guard, unit + schema suite) on the
      #     bump commit, so a bad marker or lockfile rewrite fails HERE, before the
      #     merge and tag, not on the tag's ci-cd run where the tag is already
      #     immutable. `tool-count` (no --fix) is the same drift check ci-cd runs.
      #     Pinned by tests/unit/workflow_release_guards.test.js invariant (i).
      # -----------------------------------------------------------------------
      - name: 🔁 Re-verify bumped tree
        if: steps.versions.outputs.update_needed == 'true'
        env:
          ACTUAL_SERVER_URL: http://localhost:5006
          ACTUAL_PASSWORD: dummy-password-for-tests
          ACTUAL_BUDGET_SYNC_ID: 00000000-0000-0000-0000-000000000000
        run: npm run build && npm run tool-count && npm run test:unit-js

      # -----------------------------------------------------------------------
      # 9. Merge working branch → main, tag, push, clean up branch
      # -----------------------------------------------------------------------
      - name: 🚀 Merge to main and push tag
        if: steps.versions.outputs.update_needed == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          NEW_VERSION: ${{ steps.bump.outputs.new_version }}
          LATEST: ${{ steps.versions.outputs.latest }}
        run: |
          # Checkout is authenticated with the App token (#261 fix 2), so these
          # pushes are made by the App bot and trigger downstream workflows
          # (GITHUB_TOKEN pushes would not). Guarded by
          # tests/unit/workflow_release_guards.test.js invariants (a) and (b).

          # Push the branch first so the tag is reachable from origin
          git push origin "${BRANCH}"

          # Fast-forward main to the tip of our working branch
          git checkout main
          git merge --ff-only "${BRANCH}"

          # Tag the release commit
          git tag -a "v${NEW_VERSION}" \
            -m "Release v${NEW_VERSION}: @actual-app/api ${LATEST}"

          git push origin main
          git push origin "v${NEW_VERSION}"

          # Remove the temporary working branch
          git push origin --delete "${BRANCH}"
          echo "✅ Merged, tagged v${NEW_VERSION}, branch deleted"

      # -----------------------------------------------------------------------
      # 10. Verify the tag push actually triggered the publish pipeline (#261)
      #     ci-cd.yml on the tag is what builds and publishes the Docker image,
      #     and (since #301) the GitHub Release too. If it never fires (the
      #     v0.7.12 failure mode) or fails, this job must fail loudly rather than
      #     report a successful automated release. The tag itself is already
      #     pushed and immutable; on guard failure the remediation is manual
      #     (rerun ci-cd or cut the next patch).
      # -----------------------------------------------------------------------
      - name: 🔎 Verify ci-cd pipeline triggered and succeeded
        if: steps.versions.outputs.update_needed == 'true'
        timeout-minutes: 30
        env:
          # github.token (not the App token): the guard only READS run status,
          # needs the actions:read permission granted above, and cannot expire
          # mid-watch the way the 1-hour App installation token could.
          GH_TOKEN: ${{ github.token }}
          NEW_VERSION: ${{ steps.bump.outputs.new_version }}
        run: |
          # Discovery waits on runner-queue latency, not execution: be generous
          # (40 polls x 15s = 10 minutes). `|| true` keeps a transient gh/API
          # error from aborting the loop under errexit; it retries instead.
          echo "Waiting for the CI/CD Pipeline run on tag v${NEW_VERSION} (poll 15s, timeout 10m)..."
          for _ in $(seq 1 40); do
            RUN_ID=$(gh run list --workflow ci-cd.yml --branch "v${NEW_VERSION}" --event push --limit 1 --json databaseId --jq '.[0].databaseId // empty' || true)
            if [ -n "$RUN_ID" ]; then break; fi
            sleep 15
          done
          if [ -z "$RUN_ID" ]; then
            echo "::error::ci-cd.yml never triggered on tag v${NEW_VERSION}. The push likely authenticated as GITHUB_TOKEN instead of the App (see #261); nothing was published for this tag, including the GitHub Release that ci-cd.yml owns (#301)."
            exit 1
          fi
          echo "Found ci-cd run ${RUN_ID}; watching it to completion..."
          gh run watch "$RUN_ID" --exit-status --interval 30
          echo "✅ Publish pipeline succeeded; ci-cd.yml has published the GitHub Release for this tag."

      # -----------------------------------------------------------------------
      # 11. (Removed by #301.) This lane no longer creates the GitHub Release.
      #
      # Both this workflow and ci-cd.yml used to call softprops/action-gh-release
      # on the same tag. The action upserts by tag, so there was only ever one
      # Release, but which BODY survived depended on which workflow wrote last:
      # this lane won only because the watch step above made it finish second.
      # That is ordering-dependent, not designed.
      #
      # ci-cd.yml's release job is now the single owner. It is the stronger place
      # for it: that job is tag-gated AND `needs:` every verification job
      # (docker-publish, npm-publish, security-scan, deployment-test), so it
      # structurally cannot publish a Release for a tag whose pipeline is not
      # green. The watch step above is retained as this lane's own verification:
      # `--exit-status` fails this job loudly if the publish pipeline fails.
      #
      # The two facts that used to justify this lane's richer body (the
      # @actual-app/api version and the canonical tool count) are now derived
      # from the tagged tree by ci-cd.yml's "Collect release facts" step, so
      # EVERY release carries them, not just automated dependency ones.
      #
      # Guarded by invariant (e) in tests/unit/workflow_release_guards.test.js:
      # exactly one workflow may call the release action, and it must be ci-cd.yml.
      # -----------------------------------------------------------------------

      # -----------------------------------------------------------------------
      # 12. Keep develop in sync with the auto-released main (#145)
      #     Runs AFTER the guard and Release so a sync problem can never block
      #     the publish verification or the Release itself (#261 fix 3). The
      #     old brace-group-or-fallback construct here suppressed errexit, so a
      #     failed ff-merge logged a false success and skipped the sync PR.
      # -----------------------------------------------------------------------
      - name: 🔄 Sync develop with released main
        if: steps.versions.outputs.update_needed == 'true'
        env:
          # The persisted App credential from the Checkout step (http.extraheader,
          # persist-credentials: true) authenticates EVERY `git push` in this job,
          # develop included; GH_TOKEN / APP_TOKEN are read only by the `gh` CLI,
          # never by `git push`. github.token here authenticates the read-only
          # `gh pr list`. The App token is provided separately so it can be
          # command-scoped to `gh pr create` below (#299): a PR opened by
          # github.token gets no CI runs. Scoping to the create keeps the
          # read-only gh call least-privilege; it could equally be step-level, but
          # scoping is the minimal change.
          GH_TOKEN: ${{ github.token }}
          APP_TOKEN: ${{ steps.token.outputs.token }}
          NEW_VERSION: ${{ steps.bump.outputs.new_version }}
        run: |
          git fetch origin develop:develop
          git checkout develop
          if git merge --ff-only main && git push origin develop; then
            echo "✅ Develop fast-forwarded to v${NEW_VERSION}"
          else
            # Assigned on its own line so a transient gh failure hits errexit
            # loudly instead of being swallowed inside a test condition, which
            # would falsely report an existing sync PR (#261 fix 3).
            OPEN_SYNC_PRS=$(gh pr list --base develop --head main --state open --json number --jq 'length')
            if [ "$OPEN_SYNC_PRS" != "0" ]; then
              echo "⚠ Develop has diverged; a main to develop sync PR is already open, nothing to do"
            # #299: command-scope the App token to THIS create only. A PR opened
            # with github.token gets no CI runs (the trap that shipped v0.7.12,
            # #261, one layer down); the App token makes the sync PR trigger CI.
            elif GH_TOKEN="$APP_TOKEN" gh pr create --base develop --head main \
              --title "chore: sync develop with auto-release main (v${NEW_VERSION})" \
              --body "Automated PR from dependency-update.yml. Develop has diverged from main; merge could not be fast-forward. Resolve any conflicts and merge to keep develop in sync."; then
              echo "⚠ Develop has diverged; opened a sync PR"
            else
              echo "::error::develop sync failed AND no sync PR exists or could be created; manual merge from main to develop is required (#261 fix 3)"
              exit 1
            fi
          fi

      # -----------------------------------------------------------------------
      # 13. Summary
      # -----------------------------------------------------------------------
      - name: ✅ Summary (released)
        if: steps.versions.outputs.update_needed == 'true'
        run: |
          echo "### 🎉 Release Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| @actual-app/api | \`${{ steps.versions.outputs.current }}\` → \`${{ steps.versions.outputs.latest }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Version | \`${{ steps.bump.outputs.new_version }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Release | [v${{ steps.bump.outputs.new_version }}](https://github.com/${{ github.repository }}/releases/tag/v${{ steps.bump.outputs.new_version }}) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Lint · Unit tests · Docker E2E: all green before merge" >> $GITHUB_STEP_SUMMARY

      - name: ⏭️ Summary (no update)
        if: steps.versions.outputs.update_needed == 'false'
        run: |
          echo "### ✅ Already Up to Date" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Current version \`${{ steps.versions.outputs.current }}\` is the latest: nothing to do." >> $GITHUB_STEP_SUMMARY

      # -----------------------------------------------------------------------
      # 14. Record the train outcome (#325)
      # -----------------------------------------------------------------------
      # `if: success()` is load bearing. If ANY earlier step failed this step is
      # skipped, the job output stays empty, and the reporter classifies unset as
      # a failure. That is the fail-toward-notifying default: the outcome can only
      # ever say "nothing to see here" on a run where nothing went wrong.
      - name: 🏷️ Record train outcome
        id: outcome
        if: success()
        run: |
          if [ "${{ steps.versions.outputs.update_needed }}" = "true" ]; then
            echo "value=success" >> "$GITHUB_OUTPUT"
          else
            echo "value=noop_up_to_date" >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------------------
  # #325: failure notification. Ticket zero for unattended publishing.
  #
  # A SEPARATE job, deliberately. The main job holds `contents: write` plus the
  # App installation token and runs `npm install @actual-app/api@^$LATEST`, which
  # executes registry-controlled postinstall code. Granting `issues: write` there
  # would put a tracker-write token in the same process as that code. Splitting it
  # also means this job never checks out with the App token, so the credential
  # actions/checkout persists into .git/config is never on this runner at all.
  #
  # No `concurrency:` group here on purpose: `cancel-in-progress: false` still
  # evicts a QUEUED run when a newer one arrives, so a success/failure/success
  # overlap would drop the failure report entirely. Converging duplicates in the
  # reporter is noisy but never silent, which is the correct direction.
  # ---------------------------------------------------------------------------
  report-train-failure:
    name: Report train failure
    needs: update-test-release
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
      actions: read
    steps:
      - name: 📥 Checkout (no App token, pinned to the triggering sha)
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: 📣 Report
        env:
          GH_TOKEN: ${{ github.token }}
          TRAIN_OUTCOME: ${{ needs.update-test-release.outputs.train_outcome }}
          TRAIN_VERSION: ${{ needs.update-test-release.outputs.latest_version }}
        run: node scripts/report-train-failure.mjs
