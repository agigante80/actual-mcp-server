name: Feature Request
description: Propose a new feature or enhancement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        <!-- template-version: 6 -->
        ## Feature Request
        Please fill in all required fields. Clear acceptance criteria and test plans help implementation go smoothly.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What does this feature do and why is it needed?
      placeholder: "One paragraph describing the feature and its value."
    validations:
      required: true

  - type: dropdown
    id: areas
    attributes:
      label: Affected area(s)
      description: Which parts of the codebase will this touch? If 3+, consider splitting into sub-issues.
      multiple: true
      options:
        - New MCP tool
        - Existing tool enhancement
        - HTTP server / transport
        - Auth / OIDC / ACL
        - Connection pool / performance
        - Docker / Deployment
        - Configuration / env vars
        - Documentation only
        - Tests / CI
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: "On triage a maintainer also applies the matching P0 to P3 label (and `icebox` if not committed), so priority is filterable: gh issue list --label P1"
      options:
        - P0: Critical (blocks users or breaks existing tools)
        - P1: High (important for current release)
        - P2: Medium (should do, not blocking)
        - P3: Low (nice to have)
    validations:
      required: true

  - type: textarea
    id: files
    attributes:
      label: Files to create / modify
      description: List specific files that will be created or changed. Helps scope the work.
      placeholder: |
        - **Create** `src/tools/domain_action.ts`: tool definition
        - **Edit** `src/tools/index.ts`: add export
        - **Edit** `src/actualToolsManager.ts`: add to IMPLEMENTED_TOOLS
        - **Edit** `src/lib/actual-adapter.ts`: add adapter method if needed
    validations:
      required: false

  - type: textarea
    id: implementation
    attributes:
      label: Implementation details
      description: How should this be implemented? Include code snippets if helpful.
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ---
        ## For maintainers (completed during triage)
        Reporters can leave the fields below blank. The readiness gate
        (/gate-ticket) synthesises acceptance criteria, test scenarios, and the
        unit/E2E test plan from the report. For a bug or any behaviour change, the
        fix is also validated by reproducing it first (red), then re-running after
        the fix (green); see the implement-ticket skill.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: What must be true for this feature to be considered complete?
      placeholder: |
        - [ ] Tool `actual_domain_action` exists and passes `npm run verify-tools`
        - [ ] Unit smoke test added to `tests/unit/generated_tools.smoke.test.js`
        - [ ] `npm run build && npm run test:unit-js` passes
    validations:
      required: false

  - type: textarea
    id: personal_data
    attributes:
      label: Personal data handling
      description: How does this change handle personal data? Name your privacy regime if you have one; the defaults below are regime-agnostic.
      value: |
        - **Personal-data fields affected:**
        - **Storage location and encryption at rest:**
        - **Erasure, including cascading deletion:**
        - **Portability (export on request):**
        - **Minimisation and retention:**
        - **Legal basis:**
        - **Cross-border transfer:**
    validations:
      required: true

  - type: textarea
    id: security
    attributes:
      label: Security considerations
      description: Auth, input validation, data exposure.
      value: |
        - **Authentication:** behind Bearer/OIDC? / public (justify if public)
        - **Input validation:** Zod schema defined in `src/lib/schemas/common.ts`?
        - **Data exposure:** any sensitive budget data in response?
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Other issues that must be completed before this one.
      placeholder: "Depends on: #54, #55"
    validations:
      required: false

  - type: textarea
    id: scenarios
    attributes:
      label: Test scenarios (Given / When / Then)
      description: |
        One positive and one negative scenario per condition or acceptance criterion.
        When a feature covers multiple independent conditions, repeat the block for each.
        Label each with **Positive:** or **Negative:**, use one When per scenario, and name the exact error a negative expects.
      placeholder: |
        **Condition: [name of the condition or feature aspect]**

        **Positive:** [name of the case]
        - Given: [valid starting state]
        - When: [action is performed]
        - Then: [expected correct result]

        **Negative:** [name of the case]
        - Given: [invalid or edge-case state]
        - When: [action is performed]
        - Then: [expected rejection / error message]
    validations:
      required: false

  - type: textarea
    id: unit_tests
    attributes:
      label: Unit tests
      description: Specific cases for `tests/unit/`. State file, input, and expected output.
      placeholder: |
        - [ ] Positive (`[test file]`): call with [valid input] → [expected output / field]
        - [ ] Negative (`[test file]`): call with [bad input] → ZodError / error contains "[text]"
        - [ ] Smoke entry added to `tests/unit/generated_tools.smoke.test.js` (new tools only)
        - [ ] `npm run build && npm run test:unit-js` passes
    validations:
      required: false

  - type: textarea
    id: e2e_tests
    attributes:
      label: E2E tests
      description: |
        Specific cases for `tests/e2e/docker-all-tools.e2e.spec.ts` (the only E2E file that runs). One positive and one negative per condition.
        Also note if an integration test in `tests/manual/tests/` is needed.
      placeholder: |
        - [ ] Positive (`[suite file]`): [setup] → call tool → assert [field] equals [value]
        - [ ] Negative (`[suite file]`): [bad state] → call tool → response contains error
        - [ ] Manual integration test added to `tests/manual/tests/<module>.js` if live-server behaviour must be verified
    validations:
      required: false

  - type: textarea
    id: docs_impact
    attributes:
      label: Documentation impact
      description: Which documentation does this change affect, in the docs tree and the root README? "None" needs a reason.
      placeholder: |
        - **Docs affected:**
        - **README impact:**
        - **Why not, if none:**
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ---
        ## Readiness gate

        > Run `/gate-ticket <issue-number>` after filing to trigger the readiness gate.
        > It runs mechanical checks plus one critic, with project lenses joining by label,
        > and must return **PASS** before implementation begins.
